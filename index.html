const GlobalCSS=()=><style>{`

// ═══ DATOS ═══
const ROLES={
 admin:{label:"Administrador",icon:"",color:"#F5A623",perms:["pos","pos.discount","orders","orders.cancel","inventory","inventory.edit","credits","credits.edit","reports","settings","users"]},
 cajero:{label:"Cajero",icon:"",color:"#4D9FFF",perms:["pos","orders","credits","reports"]},
 mesero:{label:"Mesero",icon:"",color:"#3DDC84",perms:["pos","orders"]},
 cocina:{label:"Cocina",icon:"‍",color:"#FF8C42",perms:["orders"]},
};
const USERS=[];
const CATS=[
 {id:"all",label:"Todo",icon:"",color:"var(--t2)"},
 {id:"proteina",label:"Proteína",icon:"",color:"#FF8C42"},
 {id:"carbohidrato",label:"Carbohidratos",icon:"",color:"#F5A623"},
 {id:"ensalada",label:"Ensalada",icon:"",color:"#3DDC84"},
 {id:"bebidas",label:"Bebidas",icon:"",color:"#4D9FFF"},
];
const INIT_PRODUCTS=[];
const INIT_CLIENTS=[];

// ═══ STORE ═══
const initialState={
 session:null,products:INIT_PRODUCTS,clients:INIT_CLIENTS,
 orders:[],activeOrder:null,orderCounter:1,
 isOnline:true,notifications:[],
 company:{name:"Mi Restaurante",tagline:"Comida saludable y deliciosa",address:"Calle Principal #123",phone:"555-0000",email:"",logo:"",footerMsg:"¡Gracias por su visita!"},
};
let _nid=1;
const addN=(state,msg,type="info")=>[...state.notifications.slice(-4),{id:_nid++,msg,type}];
function reducer(state,action){
 switch(action.type){
 case"LOGIN": return{...state,session:action.p,notifications:addN(state,`Bienvenido, ${action.p.user.name.split(" ")[0]}`,"success")};
 case"LOGOUT": return{...state,session:null,activeOrder:null};
 case"SET_ONLINE":return{...state,isOnline:action.val,notifications:addN(state,action.val?"Conexión restaurada":"Modo offline",action.val?"success":"warning")};
 case"SAVE_PRODUCT":{const e=state.products.find(p=>p.id===action.p.id);return{...state,products:e?state.products.map(p=>p.id===action.p.id?action.p:p):[...state.products,action.p],notifications:addN(state,`"${action.p.name}" guardado`,"success")};}
 case"DELETE_PRODUCT":{const nm=state.products.find(p=>p.id===action.id)?.name||"Producto";return{...state,products:state.products.filter(p=>p.id!==action.id),notifications:addN(state,`"${nm}" eliminado`,"warning")};}
 case"ADJUST_STOCK":return{...state,products:state.products.map(p=>p.id===action.id?{...p,stock:Math.max(0,p.stock+action.delta)}:p),notifications:addN(state,`Stock ajustado ${action.delta>0?"+":""}${action.delta}`,"info")};
 case"NEW_ORDER":return{...state,activeOrder:{id:`#${String(state.orderCounter).padStart(4,"0")}`,table:action.table,type:action.ot,items:[],discount:0,note:"",status:"open",createdAt:new Date().toISOString()},orderCounter:state.orderCounter+1};
 case"ADD_ITEM":{const o=state.activeOrder;if(!o)return state;const key=`${action.item.productId}-${action.item.variant||""}`;const ex=o.items.find(i=>i.key===key);return{...state,activeOrder:{...o,items:ex?o.items.map(i=>i.key===key?{...i,qty:i.qty+1}:i):[...o.items,{...action.item,key,qty:1}]}};}
 case"REMOVE_ITEM":{const o=state.activeOrder;return{...state,activeOrder:{...o,items:o.items.map(i=>i.key===action.key?{...i,qty:i.qty-1}:i).filter(i=>i.qty>0)}};}
 case"SET_DISCOUNT":return{...state,activeOrder:{...state.activeOrder,discount:action.v}};
 case"SET_NOTE": return{...state,activeOrder:{...state.activeOrder,note:action.v}};
 case"CANCEL_ORDER":return{...state,activeOrder:null};
 case"CHARGE_ORDER":{const o=state.activeOrder;const closed={...o,status:"paid",paidAt:new Date().toISOString(),paymentMethod:action.method,totalPaid:action.total,cashier:state.session?.user.name};const products=state.products.map(p=>{const it=o.items.find(i=>i.productId===p.id);return it?{...p,stock:Math.max(0,p.stock-it.qty)}:p;});return{...state,activeOrder:null,orders:[closed,...state.orders],products,notifications:addN(state,"Orden "+o.id+" cobrada — $"+Math.round(action.total).toLocaleString("es-CO")+" COP","success")};}
 case"ADD_CLIENT":return{...state,clients:[...state.clients,action.p],notifications:addN(state,`"${action.p.name}" creado`,"success")};
 case"ADD_CREDIT_TX":return{...state,clients:state.clients.map(c=>{if(c.id!==action.cid)return c;const delta=action.tx.type==="charge"?action.tx.amount:-action.tx.amount;const balance=Math.max(0,c.balance+delta);const u=(balance/c.creditLimit)*100;const riskLevel=u>=95?"critical":u>=75?"high":u>=40?"medium":"low";return{...c,balance,riskLevel,transactions:[...c.transactions,{...action.tx,id:`tx${Date.now()}`,date:new Date().toISOString(),balance}]};})};
 case"SAVE_COMPANY":return{...state,company:{...state.company,...action.p},notifications:addN(state,"Configuración guardada","success")};
 case"DISMISS_NOTIF":return{...state,notifications:state.notifications.filter(n=>n.id!==action.id)};
 default:return state;
 }
}
const Ctx=createContext(null);
const useStore=()=>useContext(Ctx);
const fmt=n=>'$'+Math.round(Number(n)).toLocaleString('es-CO')+' COP';
const mpct=(a,b)=>b>0?Math.round(((a-b)/a)*100):0;

const Badge=({variant="default",children,dot})=>{
 const v={default:{bg:"var(--el)",c:"var(--t2)",b:"var(--border)"},success:{bg:"var(--green-g)",c:"var(--green)",b:"rgba(61,220,132,.3)"},warning:{bg:"var(--amber-g)",c:"var(--amber)",b:"rgba(245,166,35,.3)"},danger:{bg:"var(--red-g)",c:"var(--red)",b:"rgba(255,77,77,.3)"},info:{bg:"var(--blue-g)",c:"var(--blue)",b:"rgba(77,159,255,.3)"},purple:{bg:"var(--purple-g)",c:"var(--purple)",b:"rgba(192,132,252,.3)"},orange:{bg:"var(--orange-g)",c:"var(--orange)",b:"rgba(255,140,66,.3)"}}[variant]||{bg:"var(--el)",c:"var(--t2)",b:"var(--border)"};

};

const Btn=({v="secondary",sz="md",children,onClick,icon,disabled,full,style:sx={}})=>{
 const [h,setH]=useState(false);
 const s={sm:{p:"7px 12px",fs:11,mh:34},md:{p:"10px 18px",fs:13,mh:44},lg:{p:"13px 22px",fs:15,mh:54}}[sz];
 const vs={primary:{bg:h?"var(--amber-d)":"var(--amber)",c:"#0D0F0E",b:"transparent"},secondary:{bg:h?"#252C29":"var(--el)",c:"var(--t1)",b:"var(--border)"},ghost:{bg:h?"var(--el)":"transparent",c:"var(--t2)",b:"transparent"},danger:{bg:h?"rgba(255,77,77,.22)":"var(--red-g)",c:"var(--red)",b:"rgba(255,77,77,.2)"},success:{bg:h?"rgba(61,220,132,.22)":"var(--green-g)",c:"var(--green)",b:"rgba(61,220,132,.2)"},amber:{bg:h?"rgba(245,166,35,.22)":"var(--amber-g)",c:"var(--amber)",b:"rgba(245,166,35,.2)"}}[v]||{bg:"var(--el)",c:"var(--t1)",b:"var(--border)"};
 return <button disabled={disabled} onClick={onClick} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)} style={{display:"inline-flex",alignItems:"center",justifyContent:"center",gap:7,padding:s.p,minHeight:s.mh,fontSize:s.fs,fontWeight:600,background:vs.bg,color:vs.c,border:`1px solid ${vs.b}`,borderRadius:9,cursor:disabled?"not-allowed":"pointer",opacity:disabled?.45:1,transition:"all .13s",width:full?"100%":"auto",userSelect:"none",WebkitTapHighlightColor:"transparent",...sx}}>{icon&&<span style={{fontSize:s.fs+2,lineHeight:1}}>{icon}</span>}{children}</button>;

 {suffix&&<span style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",color:"var(--t3)",fontFamily:"'DM Mono',monospace",fontSize:12,pointerEvents:"none"}}>{suffix}</span>}

// ═══ LOGIN ═══
const PinPad=({onComplete})=>{
 const [pin,setPin]=useState("");
 const hit=useCallback(k=>{
 if(k==="⌫"){setPin(p=>p.slice(0,-1));return;}
 if(k==="C"){setPin("");return;}
 const next=pin+k;setPin(next);
 if(next.length===4){setTimeout(()=>{onComplete(next);setPin("");},100);}
 },[pin,onComplete]);
 useEffect(()=>{
 const h=e=>{if(e.key>="0"&&e.key<="9")hit(e.key);if(e.key==="Backspace")hit("⌫");if(e.key==="Escape")hit("C");};
 window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
 },[hit]);
 return <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20}}>
 <div style={{display:"flex",gap:12}}>{[0,1,2,3].map(i=><div key={i} style={{width:13,height:13,borderRadius:"50%",background:i<pin.length?"var(--amber)":"var(--border)",transition:"background .12s,transform .12s",transform:i<pin.length?"scale(1.2)":"scale(1)"}}/>)}</div>
 <div style={{display:"grid",gridTemplateColumns:"repeat(3,68px)",gap:8}}>
 {["1","2","3","4","5","6","7","8","9","C","0","⌫"].map(k=>(
 <button key={k} onClick={()=>hit(k)} style={{width:68,height:68,borderRadius:12,background:k==="⌫"||k==="C"?"var(--el)":"var(--surface)",border:"1px solid var(--border)",color:k==="⌫"?"var(--red)":k==="C"?"var(--t3)":"var(--t1)",fontSize:20,fontFamily:"'DM Mono',monospace",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",userSelect:"none"}}
 onMouseDown={e=>e.currentTarget.style.transform="scale(.92)"} onMouseUp={e=>e.currentTarget.style.transform="scale(1)"} onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}>
 {k}
 </button>
 ))}
 </div>
 </div>;
};

const LoginScreen=()=>{
 const {dispatch}=useStore();
 const [step,setStep]=useState("users");
 const [user,setUser]=useState(null);
 const [err,setErr]=useState("");const [at,setAt]=useState(0);
 const [locked,setLocked]=useState(false);const [lockT,setLockT]=useState(0);
 useEffect(()=>{
 if(!locked)return;let t=30;setLockT(t);
 const iv=setInterval(()=>{t--;setLockT(t);if(t<=0){clearInterval(iv);setLocked(false);setAt(0);}},1000);
 return()=>clearInterval(iv);
 },[locked]);
 const handlePin=pin=>{
 if(locked)return;
 if(pin===user.pin){dispatch({type:"LOGIN",p:{user,role:ROLES[user.role],perms:ROLES[user.role].perms,startedAt:new Date().toISOString()}});}
 else{const a=at+1;setAt(a);setErr(a>=3?"Bloqueado 30s":`PIN incorrecto · ${3-a} intento(s)`);if(a>=3)setLocked(true);}
 };
 return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",background:"var(--bg)",overflow:"auto",position:"relative"}}>
 <div style={{position:"fixed",inset:0,pointerEvents:"none",backgroundImage:"linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px)",backgroundSize:"44px 44px",opacity:.3}}/>
 <div style={{padding:"24px 24px 0",display:"flex",alignItems:"center",gap:12,position:"relative",zIndex:1}}>
 <div style={{width:40,height:40,borderRadius:10,background:"var(--amber)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:900,color:"#0D0F0E"}}>G</div>
 <div><div style={{fontSize:16,fontWeight:800}}>GASTRO POS</div><div style={{fontSize:9,color:"var(--amber)",fontFamily:"'DM Mono',monospace",letterSpacing:".1em"}}>SISTEMA DE GESTIÓN v1.0</div></div>
 <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}>
 <span style={{width:6,height:6,borderRadius:"50%",background:"var(--green)",animation:"pulse 2s infinite",display:"block"}}/>
 <span style={{fontSize:9,color:"var(--t3)",fontFamily:"'DM Mono',monospace"}}>{new Date().toLocaleDateString("es",{day:"numeric",month:"short"}).toUpperCase()}</span>
 </div>
 </div>
 <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",position:"relative",zIndex:1}}>
 <div style={{width:"100%",maxWidth:420,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:20,padding:"32px 28px",boxShadow:"0 24px 60px rgba(0,0,0,.4)"}}>
 <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:24}}>
 {["Perfil","PIN"].map((s,i)=>{const idx=step==="users"?0:1;const done=i<idx,act=i===idx;return(
 <div key={i} style={{display:"flex",alignItems:"center",gap:8}}>
 <div style={{width:26,height:26,borderRadius:7,background:done?"var(--green)":act?"var(--amber)":"var(--el)",border:`1px solid ${done?"var(--green)":act?"var(--amber)":"var(--border)"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,fontFamily:"'DM Mono',monospace",color:(done||act)?"#0D0F0E":"var(--t3)",transition:"all .2s"}}>{done?"":i+1}</div>
 <span style={{fontSize:12,color:act?"var(--t1)":"var(--t3)",fontWeight:act?600:400}}>{s}</span>
 {i<1&&<div style={{width:20,height:1,background:"var(--border)",margin:"0 4px"}}/>}
 </div>
 );})}
 </div>
 {step==="users"?(
 <div className="fu" style={{display:"flex",flexDirection:"column",gap:10}}>
 <div style={{fontSize:11,color:"var(--t3)",fontFamily:"'DM Mono',monospace",letterSpacing:".1em",textTransform:"uppercase",marginBottom:6}}>Selecciona tu perfil</div>
 {USERS.map((u,i)=>{const r=ROLES[u.role];return(
 <button key={u.id} onClick={()=>{setUser(u);setStep("pin");setErr("");setAt(0);}} className="fu"
 style={{display:"flex",alignItems:"center",gap:13,padding:"13px 16px",background:"transparent",border:"1px solid var(--border)",borderRadius:12,cursor:"pointer",textAlign:"left",width:"100%",transition:"all .14s",animationDelay:`${i*.05}s`,animationFillMode:"both"}}
 onMouseEnter={e=>{e.currentTarget.style.background="var(--el)";e.currentTarget.style.borderColor=`${r.color}40`;}}
 onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.borderColor="var(--border)";}}>
 <div style={{width:42,height:42,borderRadius:11,flexShrink:0,background:`${r.color}18`,border:`1px solid ${r.color}35`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{r.icon}</div>
 <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:"var(--t1)"}}>{u.name}</div><div style={{fontSize:10,color:r.color,fontFamily:"'DM Mono',monospace",letterSpacing:".06em",textTransform:"uppercase",marginTop:2}}>{r.label}</div></div>
 <span style={{fontSize:18,color:"var(--t3)"}}></span>
 </button>
 );})}
 </div>
 ):(
 <div className="fu" style={{display:"flex",flexDirection:"column",alignItems:"center",gap:22}}>
 {user&&(()=>{const r=ROLES[user.role];return(
 <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 18px",background:"var(--el)",border:`1px solid ${r.color}30`,borderRadius:12,width:"100%"}}>
 <div style={{width:42,height:42,borderRadius:10,background:`${r.color}18`,border:`1px solid ${r.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>{r.icon}</div>
 <div><div style={{fontSize:14,fontWeight:700}}>{user.name}</div><div style={{fontSize:10,color:r.color,fontFamily:"'DM Mono',monospace",letterSpacing:".06em",textTransform:"uppercase",marginTop:2}}>{r.label}</div></div>
 </div>
 );})()}
 {err&&<div style={{padding:"9px 14px",background:locked?"var(--red-g)":"rgba(255,77,77,.07)",border:"1px solid rgba(255,77,77,.22)",borderRadius:9,width:"100%",fontSize:12,color:"var(--red)",fontFamily:"'DM Mono',monospace"}}>{locked?` ${err} (${lockT}s)`:` ${err}`}</div>}
 <PinPad onComplete={handlePin}/>
 <button onClick={()=>{setStep("users");setUser(null);setErr("");}} style={{background:"transparent",border:"none",color:"var(--t3)",fontSize:12,cursor:"pointer",padding:"6px 12px",borderRadius:7}} onMouseEnter={e=>e.currentTarget.style.color="var(--t2)"} onMouseLeave={e=>e.currentTarget.style.color="var(--t3)"}> Cambiar usuario</button>
 </div>
 )}
 </div>
 </div>
 </div>;
};

const ReportsModule=()=>{
 const {state}=useStore();
 const {orders,products}=state;
 const metrics=useMemo(()=>{
 const revenue=orders.reduce((s,o)=>s+o.totalPaid,0);
 const cost=orders.reduce((s,o)=>s+o.items.reduce((is,i)=>{const p=products.find(p=>p.id===i.productId);return is+(p?p.cost*i.qty:0);},0),0);
 const profit=revenue-cost;const margin=revenue>0?(profit/revenue)*100:0;
 const byMethod={efectivo:0,tarjeta:0,transferencia:0};
 orders.forEach(o=>{if(byMethod[o.paymentMethod]!==undefined)byMethod[o.paymentMethod]+=o.totalPaid;});
 const tp={};orders.forEach(o=>o.items.forEach(i=>{if(!tp[i.name])tp[i.name]={name:i.name,revenue:0,qty:0};tp[i.name].revenue+=i.price*i.qty;tp[i.name].qty+=i.qty;}));
 return{revenue,cost,profit,margin,byMethod,count:orders.length,avgTicket:orders.length>0?revenue/orders.length:0,topProducts:Object.values(tp).sort((a,b)=>b.revenue-a.revenue).slice(0,5)};
 },[orders,products]);

 if(orders.length===0) return <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:14,opacity:.4,padding:40}}>
 <div style={{fontSize:48}}></div>
 <div style={{fontFamily:"'DM Mono',monospace",fontSize:12,color:"var(--t3)",textAlign:"center"}}>Sin ventas aún.<br/>Completa órdenes en el POS para ver reportes.</div>
 </div>;

 return <div style={{padding:16,display:"flex",flexDirection:"column",gap:14,overflowY:"auto",height:"100%"}}>
 <h2 style={{fontSize:18,fontWeight:800}}>Reportes del Turno</h2>
 <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:9}}>
 {[["Ingresos",fmt(metrics.revenue),"","var(--amber)"],["Costo",fmt(metrics.cost),"","var(--red)"],["Ganancia",fmt(metrics.profit),"","var(--green)"],["Margen",`${metrics.margin.toFixed(1)}%`,"%",metrics.margin>=60?"var(--green)":metrics.margin>=40?"var(--amber)":"var(--red)"],["Órdenes",metrics.count,"","var(--blue)"],["Ticket prom.",fmt(metrics.avgTicket),"","var(--purple)"]].map(([l,v,ic,c],i)=>(
 <div key={i} className="fu" style={{padding:"12px 14px",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:11,animationDelay:`${i*.04}s`,animationFillMode:"both"}}>
 <div style={{fontSize:9,color:"var(--t3)",fontFamily:"'DM Mono',monospace",letterSpacing:".08em",textTransform:"uppercase",marginBottom:5}}>{l}</div>
 <div style={{fontSize:20,fontWeight:800,fontFamily:"'DM Mono',monospace",color:c}}>{v}</div>
 </div>
 ))}
 </div>
 <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
 <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px"}}>
 <div style={{fontSize:12,fontWeight:700,marginBottom:10}}>Métodos de Pago</div>
 {Object.entries(metrics.byMethod).map(([m,v],i)=>{const t=metrics.revenue||1;return(
 <div key={i} style={{marginBottom:9}}>
 <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:11,color:"var(--t2)",textTransform:"capitalize"}}>{m}</span><span style={{fontFamily:"'DM Mono',monospace",fontSize:11,fontWeight:700,color:["var(--green)","var(--blue)","var(--purple)"][i]}}>{fmt(v)}</span></div>
 <div style={{height:4,background:"var(--border)",borderRadius:2,overflow:"hidden"}}><div style={{width:`${(v/t)*100}%`,height:"100%",background:["var(--green)","var(--blue)","var(--purple)"][i],borderRadius:2}}/></div>
 </div>
 );})}
 </div>
 <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px"}}>
 <div style={{fontSize:12,fontWeight:700,marginBottom:10}}>Top Productos</div>
 {metrics.topProducts.length===0?<div style={{fontSize:11,color:"var(--t3)",fontFamily:"'DM Mono',monospace"}}>Sin datos</div>
 :metrics.topProducts.map((p,i)=>(
 <div key={i} style={{marginBottom:7}}>
 <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}><span style={{fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1,marginRight:6}}>{p.name}</span><span style={{fontFamily:"'DM Mono',monospace",fontSize:11,fontWeight:700,color:"var(--amber)",flexShrink:0}}>{fmt(p.revenue)}</span></div>
 <div style={{height:3,background:"var(--border)",borderRadius:2,overflow:"hidden"}}><div style={{width:`${(p.revenue/(metrics.topProducts[0]?.revenue||1))*100}%`,height:"100%",background:"var(--amber)",borderRadius:2}}/></div>
 </div>
 ))}
 </div>
 </div>
 <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,overflow:"hidden"}}>
 <div style={{padding:"11px 16px",borderBottom:"1px solid var(--border)",fontSize:13,fontWeight:700}}>Órdenes</div>
 {orders.map((o,i)=>(
 <div key={o.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 16px",borderBottom:i<orders.length-1?"1px solid var(--border)":"none"}}
 onMouseEnter={e=>e.currentTarget.style.background="var(--el)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
 <span style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:"var(--t3)",width:48}}>{o.id}</span>
 <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600}}>{o.type==="mesa"?`Mesa ${o.table}`:o.type==="llevar"?"Llevar":"Delivery"}</div><div style={{fontSize:10,color:"var(--t2)",fontFamily:"'DM Mono',monospace"}}>{o.items.length} items · {o.paymentMethod}</div></div>
 <span style={{fontFamily:"'DM Mono',monospace",fontSize:14,fontWeight:700}}>{fmt(o.totalPaid)}</span>
 <Badge variant={o.paymentMethod==="efectivo"?"success":o.paymentMethod==="tarjeta"?"info":"purple"}>{o.paymentMethod==="transferencia"?"transf.":o.paymentMethod}</Badge>
 </div>
 ))}
 </div>
 </div>;
};

// ═══ TOASTS ═══
const ToastSystem=({notifications,dispatch})=>{
 useEffect(()=>{
 if(!notifications.length)return;
 const n=notifications[notifications.length-1];
 const t=setTimeout(()=>dispatch({type:"DISMISS_NOTIF",id:n.id}),3200);
 return()=>clearTimeout(t);
 },[notifications]);
 return <div style={{position:"fixed",bottom:16,right:16,zIndex:999,display:"flex",flexDirection:"column",gap:7,pointerEvents:"none"}}>
 {notifications.map(n=>{
 const c={success:{bg:"var(--green-g)",b:"rgba(61,220,132,.35)",c:"var(--green)"},warning:{bg:"var(--amber-g)",b:"rgba(245,166,35,.35)",c:"var(--amber)"},error:{bg:"var(--red-g)",b:"rgba(255,77,77,.35)",c:"var(--red)"},info:{bg:"var(--blue-g)",b:"rgba(77,159,255,.35)",c:"var(--blue)"}}[n.type]||{bg:"var(--el)",b:"var(--border)",c:"var(--t2)"};
 return <div key={n.id} style={{padding:"9px 13px",background:c.bg,border:`1px solid ${c.b}`,borderRadius:9,maxWidth:280,boxShadow:"0 8px 24px rgba(0,0,0,.4)",animation:"toast 3.2s ease forwards",display:"flex",alignItems:"center",gap:8}}>
 <span style={{fontSize:13,flexShrink:0}}>{n.type==="success"?"":n.type==="error"?"":n.type==="warning"?"":""}</span>
 <span style={{fontSize:11,color:c.c,fontFamily:"'DM Mono',monospace",lineHeight:1.4}}>{n.msg}</span>
 </div>;
 })}
 </div>;
};


// ═══ APP SHELL ═══
const NAV=[
 {id:"pos",icon:"",label:"POS",perm:"pos"},
 {id:"orders",icon:"",label:"Órdenes",perm:"orders"},
 {id:"inventory",icon:"",label:"Inventario",perm:"inventory"},
 {id:"credits",icon:"",label:"Créditos",perm:"credits"},
 {id:"reports",icon:"",label:"Reportes",perm:"reports"},
 {id:"settings",icon:"",label:"Config",perm:"settings"},
];

const AppShell=()=>{
 const {state,dispatch}=useStore();
 const {session,products,orders,company}=state;
 const [view,setView]=useState("pos");
 const [col,setCol]=useState(false);
 const [elapsed,setElapsed]=useState("00:00");
 const [clock,setClock]=useState(new Date());

 const lowStock=products.filter(p=>p.stock>0&&p.stock<=p.minStock).length;
 const outStock=products.filter(p=>p.stock===0).length;

 useEffect(()=>{
 const start=new Date(session.startedAt);
 const tick=()=>{setClock(new Date());const d=Math.floor((Date.now()-start)/1000);setElapsed(`${String(Math.floor(d/60)).padStart(2,"0")}:${String(d%60).padStart(2,"0")}`);};
 tick();const iv=setInterval(tick,1000);return()=>clearInterval(iv);
 },[session.startedAt]);

 const allowed=NAV.filter(n=>session.perms.includes(n.perm));
 const activeView=allowed.find(n=>n.id===view)?view:allowed[0]?.id;
 const alerts={inventory:lowStock+outStock,orders:orders.filter(o=>o.status==="open").length};
 const r=session.role;
 const fullH=["pos","inventory","credits"].includes(activeView);

 const renderView=()=>{
 if(activeView==="pos") return <POSModule/>;
 if(activeView==="inventory") return <InventoryModule/>;
 if(activeView==="credits") return <CreditsModule/>;
 if(activeView==="reports") return <ReportsModule/>;
 if(activeView==="orders") return <OrdersModule/>;
 if(activeView==="settings") return <SettingsModule/>;
 return null;
 };

 return <div style={{display:"flex",height:"100vh",overflow:"hidden"}}>
 {/* Sidebar */}
 <nav style={{width:col?58:200,height:"100%",background:"var(--surface)",borderRight:"1px solid var(--border)",display:"flex",flexDirection:"column",transition:"width .2s ease",flexShrink:0,overflow:"hidden"}}>
 <div style={{padding:col?"16px 0":"16px 13px",display:"flex",alignItems:"center",justifyContent:col?"center":"flex-start",gap:9,borderBottom:"1px solid var(--border)",minHeight:60}}>
 {company.logo
 ?<img src={company.logo} style={{width:30,height:30,borderRadius:7,objectFit:"cover",flexShrink:0}} alt="logo"/>
 :<div style={{width:30,height:30,borderRadius:7,background:"var(--amber)",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900,color:"#0D0F0E"}}>{(company.name||"G").slice(0,1)}</div>
 }
 {!col&&<div style={{minWidth:0}}><div style={{fontSize:12,fontWeight:800,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{company.name||"GASTRO POS"}</div><div style={{fontSize:8,color:"var(--amber)",fontFamily:"'DM Mono',monospace",letterSpacing:".1em"}}>v1.0</div></div>}
 </div>
 <div style={{flex:1,padding:"6px 5px",display:"flex",flexDirection:"column",gap:2}}>
 {allowed.map(item=>{const act=activeView===item.id;const alert=alerts[item.id]||0;return(
 <button key={item.id} onClick={()=>setView(item.id)} title={col?item.label:undefined}
 style={{display:"flex",alignItems:"center",justifyContent:col?"center":"flex-start",gap:8,padding:col?"10px":"10px 11px",borderRadius:8,background:act?"var(--amber-g)":"transparent",border:`1px solid ${act?"rgba(245,166,35,.25)":"transparent"}`,color:act?"var(--amber)":"var(--t2)",cursor:"pointer",transition:"all .13s",fontSize:12,fontWeight:act?700:500,width:"100%",textAlign:"left",position:"relative"}}>
 <span style={{fontSize:15,flexShrink:0}}>{item.icon}</span>
 {!col&&<span style={{flex:1}}>{item.label}</span>}
 {!col&&alert>0&&<span style={{background:"var(--amber)",color:"#0D0F0E",borderRadius:20,padding:"1px 5px",fontSize:9,fontWeight:800,fontFamily:"'DM Mono',monospace"}}>{alert}</span>}
 {col&&alert>0&&<span style={{position:"absolute",top:4,right:4,width:6,height:6,borderRadius:"50%",background:"var(--amber)"}}/>}
 </button>
 );})}
 </div>
 <div style={{padding:col?"12px 0":"12px 13px",borderTop:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:col?"center":"flex-start",gap:7}}>
 <span style={{width:6,height:6,borderRadius:"50%",background:state.isOnline?"var(--green)":"var(--red)",animation:state.isOnline?"syncRing 3s infinite":"pulse 1s infinite",flexShrink:0}}/>
 {!col&&<span style={{fontSize:9,color:state.isOnline?"var(--green)":"var(--red)",fontFamily:"'DM Mono',monospace",letterSpacing:".07em"}}>{state.isOnline?"EN LÍNEA":"OFFLINE"}</span>}
 </div>
 </nav>

 {/* Main */}
 <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0}}>
 <header style={{height:56,background:"var(--surface)",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",padding:"0 14px",gap:10,flexShrink:0}}>
 <button onClick={()=>setCol(p=>!p)} style={{width:30,height:30,borderRadius:7,background:"var(--el)",border:"1px solid var(--border)",color:"var(--t2)",cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}></button>
 <h1 style={{fontSize:13,fontWeight:700,flex:1}}>{NAV.find(n=>n.id===activeView)?.label||""}</h1>
 <div style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:"var(--t2)"}}>{clock.toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})}</div>
 <div style={{display:"flex",alignItems:"center",gap:5,padding:"4px 9px",background:"var(--el)",border:"1px solid var(--border)",borderRadius:7}}>
 <span style={{fontSize:9,color:"var(--t3)",fontFamily:"'DM Mono',monospace"}}>TURNO</span>
 <span style={{fontSize:11,color:"var(--amber)",fontFamily:"'DM Mono',monospace",fontWeight:500}}>{elapsed}</span>
 </div>
 <div style={{display:"flex",alignItems:"center",gap:8,padding:"5px 10px",background:"var(--el)",border:"1px solid var(--border)",borderRadius:7}}>
 <div style={{width:24,height:24,borderRadius:6,background:`${r.color}18`,border:`1px solid ${r.color}35`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>{r.icon}</div>
 <div><div style={{fontSize:11,fontWeight:700,lineHeight:1}}>{session.user.name.split(" ")[0]}</div><div style={{fontSize:9,color:"var(--t3)",fontFamily:"'DM Mono',monospace"}}>{r.label}</div></div>
 </div>
 <button onClick={()=>dispatch({type:"SET_ONLINE",val:!state.isOnline})} title={state.isOnline?"Simular offline":"Reconectar"}
 style={{width:30,height:30,borderRadius:7,background:state.isOnline?"var(--el)":"var(--red-g)",border:`1px solid ${state.isOnline?"var(--border)":"rgba(255,77,77,.3)"}`,color:state.isOnline?"var(--t3)":"var(--red)",cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}>
 {state.isOnline?"":""}
 </button>
 <button onClick={()=>dispatch({type:"LOGOUT"})}
 style={{padding:"5px 11px",background:"var(--red-g)",border:"1px solid rgba(255,77,77,.22)",borderRadius:7,cursor:"pointer",color:"var(--red)",fontSize:11,fontWeight:600,transition:"all .13s"}}
 onMouseEnter={e=>e.currentTarget.style.background="rgba(255,77,77,.18)"} onMouseLeave={e=>e.currentTarget.style.background="var(--red-g)"}>
 Salir
 </button>
 </header>
 <main style={{flex:1,overflow:fullH?"hidden":"auto"}}>{renderView()}</main>
 </div>
 </div>;
};

// ═══ ENTRY POINT ═══
function App(){
 const [state,dispatch]=useReducer(reducer,initialState);
 useEffect(()=>{
 const on=()=>dispatch({type:"SET_ONLINE",val:true});
 const off=()=>dispatch({type:"SET_ONLINE",val:false});
 window.addEventListener("online",on);window.addEventListener("offline",off);
 return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off);};
 },[]);
 return <Ctx.Provider value={{state,dispatch}}>
 <GlobalCSS/>
 {state.session?<AppShell/>:<LoginScreen/>}
 <ToastSystem notifications={state.notifications} dispatch={dispatch}/>
 </Ctx.Provider>;
}

try {
 document.getElementById('loading').style.display='none';
 document.getElementById('root').style.display='block';
 ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
} catch(e) {
 document.getElementById('loading').innerHTML = '<div style="color:#FF4D4D;font-family:monospace;padding:20px;text-align:center"><div style="font-size:40px;margin-bottom:12px"></div><div style="font-size:13px;margin-bottom:8px">Error al cargar</div><div style="font-size:11px;color:#8A9490;max-width:300px">'+e.message+'</div></div>';
}
 </script>
</body>
